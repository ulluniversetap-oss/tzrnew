<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ЖК Новый</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<section class="hero">
  <div class="hero__media">
    <img src="images/hero.webp" alt="ЖК Новый" class="hero__img">
    <div class="hero__overlay"></div>
  </div>

  <header class="header">
    <div class="header__group header__group--left reveal" style="--reveal-delay: 0.05s">
      <button class="menu-toggle" type="button" aria-label="Открыть меню">
        <span class="burger">
          <span class="burger__line"></span>
          <span class="burger__line"></span>
          <span class="burger__line"></span>
        </span>
        <span class="header__menu-label">Меню</span>
      </button>

      <a href="#apartments" class="header__link header__link--nav">Смотреть квартиры</a>
    </div>

    <a href="#" class="header__logo reveal" style="--reveal-delay: 0.15s" aria-label="ЖК Новый — на главную">
      <svg viewBox="0 0 100 60" fill="none" xmlns="http://www.w3.org/2000/svg">
        <mask id="skylineMask">
          <rect width="100" height="60" fill="#fff"/>
          <rect x="42" y="18" width="16" height="38" fill="#000"/>
          <rect x="29" y="29" width="11" height="27" fill="#000"/>
          <rect x="60" y="29" width="11" height="27" fill="#000"/>
          <rect x="17" y="37" width="10" height="19" fill="#000"/>
          <rect x="73" y="37" width="10" height="19" fill="#000"/>
          <rect x="6" y="45" width="9" height="11" fill="#000"/>
          <rect x="85" y="45" width="9" height="11" fill="#000"/>
        </mask>
        <path d="M5,56 A45,45 0 0 1 95,56 Z" fill="currentColor" mask="url(#skylineMask)"/>
        <rect x="48.5" y="5" width="3" height="15" fill="currentColor"/>
      </svg>
    </a>

    <div class="header__group header__group--right reveal" style="--reveal-delay: 0.05s">
      <a href="tel:+79999999999" class="header__phone">+7 (999) 999-99-99</a>
      <a href="#callback" class="header__link header__link--callback">Обратный звонок</a>
    </div>
  </header>

  <div class="hero__bottom">
    <h1 class="hero__title reveal" style="--reveal-delay: 0.25s">ЖК Новый</h1>

    <div class="hero__aside reveal" style="--reveal-delay: 0.45s">
      <p class="hero__tagline">Закрытый двор без машин, детские площадки и парк в пяти минутах пешком.</p>
      <a href="#about" class="scroll-cue" aria-label="Прокрутить к описанию проекта">
        <span class="scroll-cue__line"></span>
      </a>
    </div>
  </div>
</section>

<script src="js/script.js"></script>
</body>
</html>
